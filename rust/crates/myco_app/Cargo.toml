[package]
name = "myco_app"
description = "Mycelarium Bevy shell: assets, display, cameras, fixed-step simulation bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Only what the game uses (2D meshes and sprites with our shaders, Text2d, audio, the macOS
# window): Bevy's defaults add 3D/PBR, glTF, UI, picking, scenes, gizmos and gamepads, about a
# third of the binary.
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "default_font",
    "png",
    "bevy_audio",
    "vorbis",
    "wav",
] }
myco_core = { path = "../myco_core" }
ab_glyph = "0.2.32"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }

[features]
# conformance debugging: print the callers of game-RNG draws in the steps MYCO_TRACE_STEPS=a-b
trace-draws = ["myco_core/trace-draws"]
