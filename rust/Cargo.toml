[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

# The shipped app (tools/package_rust.sh): thin LTO, no symbols, abort on panic (the panic log
# hook still runs first; no unwind tables). Tests and dev runs keep `release`.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
panic = "abort"
